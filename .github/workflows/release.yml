name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual build"
        required: false
        default: "Manual release trigger"

jobs:
  get_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract version from pubspec.yaml
        id: extract_version
        run: |
          VERSION=$(grep 'version: ' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1 | xargs)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: get_version
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev liblzma-dev libstdc++6 pkg-config

      - name: Install dependencies
        run: flutter pub get

      - name: Build desktop
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            flutter build windows --release
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            flutter build macos --release
          else
            flutter build linux --release
          fi
        shell: bash

      - name: Prepare package
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cd build/windows/x64/runner/Release/
            7z a -r $GITHUB_WORKSPACE/windows-app.zip .
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cd build/macos/Build/Products/Release/
            zip -ry $GITHUB_WORKSPACE/macos-app.zip *.app
          else
            cd build/linux/x64/release/bundle/
            tar -czvf $GITHUB_WORKSPACE/linux-app.tar.gz .
          fi

      - name: Upload prepared package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-package
          path: |
            windows-app.zip
            linux-app.tar.gz
            macos-app.zip
          if-no-files-found: error

  release:
    name: Create release
    needs: [ get_version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.get_version.outputs.version }}
          name: Release v${{ needs.get_version.outputs.version }}
          body: "Manual build for version ${{ needs.get_version.outputs.version }}."
          files: |
            windows-app.zip
            linux-app.tar.gz
            macos-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
